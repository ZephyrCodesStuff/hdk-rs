[package]
name = "hdk-secure"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = { version = "1.5.0", default-features = false }
cipher = { version = "0.4", default-features = false }
ctr = { version = "0.9.2", default-features = false }
cbc = { version = "0.1", default-features = false }
ecb = { version = "0.1", default-features = false }
uuid = { version = "1.19.0", default-features = false, features = ["v4"] }
crc16 = { version = "0.4.0", default-features = false }
rand = { version = "0.9.2", default-features = false }
hex = { version = "0.4.3", default-features = false }
binrw = { version = "0.15.0", default-features = false }


[features]
default = ["std"]
std = [
    "binrw/std",
    "byteorder/std",
    "cipher/std",
    "uuid/std",
    "rand/std",
    "rand/thread_rng",
    "hex/std",
]
simd = []


